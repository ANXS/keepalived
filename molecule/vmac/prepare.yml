---
- name: "Prepare nodes for keepalived vmac testing"
  hosts: keepalived_nodes
  become: true
  tasks:
    - name: "Update apt cache"
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "Install test dependencies"
      ansible.builtin.apt:
        pkg:
          # shellcheck lints the rendered scripts, curl backs the http_health
          # builtin check, iputils-ping probes the VIP from the peer node,
          # tcpdump watches the peer's uplink for frames sourced from the
          # virtual MAC.
          - "shellcheck"
          - "curl"
          - "iputils-ping"
          - "tcpdump"
        state: present

    # Sends multicast out a named interface the way a UPnP/SSDP discovery
    # client does: that is the traffic a quieted BACKUP must never emit.
    - name: "Install the virtual MAC leak sender"
      ansible.builtin.copy:
        dest: "/usr/local/bin/molecule-vmac-send"
        owner: "root"
        group: "root"
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """Send UDP multicast datagrams out one interface; report how many left."""
          import socket
          import struct
          import sys

          ifname = sys.argv[1]
          count = int(sys.argv[2]) if len(sys.argv) > 2 else 3
          sent = errors = 0
          last = ""
          try:
              index = socket.if_nametoindex(ifname)
          except OSError as exc:
              print(f"sent=0 errors={count} last={exc.strerror}")
              sys.exit(0)
          for _ in range(count):
              sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  mreqn = struct.pack("4s4si", b"\0" * 4, b"\0" * 4, index)
                  sock.setsockopt(socket.IPPROTO_IP, socket.IP_MULTICAST_IF, mreqn)
                  sock.sendto(b"M-SEARCH * HTTP/1.1\r\n\r\n", ("239.255.255.250", 1900))
                  sent += 1
              except OSError as exc:
                  errors += 1
                  last = exc.strerror or str(exc)
              finally:
                  sock.close()
          print(f"sent={sent} errors={errors} last={last}")

    - name: "Create health endpoint document root"
      ansible.builtin.file:
        path: "/var/www/molecule-health"
        state: directory
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "Create health endpoint body"
      ansible.builtin.copy:
        content: "ok\n"
        dest: "/var/www/molecule-health/health"
        owner: "root"
        group: "root"
        mode: "0644"

    # The http_health builtin check needs something that really answers 200.
    # A stdlib http.server under systemd is the fewest moving parts that works
    # identically on every distro in the matrix.
    - name: "Install health endpoint unit"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/molecule-health.service"
        owner: "root"
        group: "root"
        mode: "0644"
        content: |
          [Unit]
          Description=molecule http health endpoint
          After=network.target

          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --directory /var/www/molecule-health
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: "Start health endpoint"
      ansible.builtin.systemd:
        name: "molecule-health.service"
        state: started
        enabled: true
        daemon_reload: true

    - name: "Wait for health endpoint"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health"
        status_code: 200
      register: keepalived_health_probe
      until: keepalived_health_probe.status | default(0) == 200
      retries: 15
      delay: 1
