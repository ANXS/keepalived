---
- name: "Touch maint files for start_maint"
  ansible.builtin.file:
    path: "{{ item.maint_file }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
  loop: "{{ keepalived_instances }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - keepalived_start_maint | bool
    - item.maint_file | default('') != ''
  changed_when: false

- name: "Ensure keepalived started"
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
  register: keepalived_started

- name: "Restart keepalived"
  ansible.builtin.service:
    name: keepalived
    state: restarted
  when: >-
    (not keepalived_started.changed) and
      (keepalived_config.changed
      or keepalived_notify_scripts.changed | default(false)
      or keepalived_custom_notify_scripts.changed | default(false)
      or keepalived_check_wrappers.changed | default(false)
      or keepalived_builtin_scripts.changed | default(false)
      or keepalived_user_scripts.changed | default(false))

# keepalived's notify applies the helper on every transition, including the
# first after start. A changed helper on an instance that is not about to
# transition would otherwise wait indefinitely.
- name: "Apply the virtual MAC quiet state to running instances"
  ansible.builtin.command:
    cmd: "{{ keepalived_conf_dir }}/vmac_quiet_{{ item.name }}.sh apply"
  loop: "{{ keepalived_vmac_quiet_instances | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    keepalived_vmac_quiet_instances | default([]) | length > 0
    and keepalived_vmac_quiet_scripts.changed | default(false)
  changed_when: true
